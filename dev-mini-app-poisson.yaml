---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: true
      allow_read:
        - /
      allow_write:
        - /home/runner
  mirrors:
    spack-stack:
      url: oci://ghcr.io/numpex/spack-stack
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@14.3'
    cxx:
      require: 'gcc@14.3'
    fortran:
      require: 'gcc@14.3'
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer: 
        - '~performance'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.06
    builtin:
      branch: releases/v2026.06
  specs:
    - group: compiler
      specs:
        - 'gcc@14.3'
    - group: app
      needs: [compiler]
      specs:
        - 'cmake@4.3'
        - 'gyselalibxx@0.8'
        - 'ninja@1.13'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
