spack:
  include:
    - path: project-site
      optional: true
    - path: project
      optional: true
    - path: site/externals.yaml
      optional: true
    - path: site
      optional: true
    - path: common
      optional: true
  specs:
    - openmpi
    - pdi +python ~fortran
    - pdiplugin-mpi
    - pdiplugin-pycall
    - pdiplugin-trace
    - py-deisa-dask
    - py-deisa-ray
  concretizer:
    reuse: false
    unify: true
