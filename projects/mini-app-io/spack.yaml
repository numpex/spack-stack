spack:
  include:
    - path: project
      optional: true
    - path: site/externals.yaml
      optional: true
    - path: site
      optional: true
    - path: common
      optional: true
  specs:
    - cxx
    - cmake@4.3
    - gyselalibxx@0.8
    - ninja@1.13
    - pdiplugin-decl-hdf5@1.11 +mpi
    - pdiplugin-decl-netcdf@1.11 +mpi
    - pdiplugin-mpi@1.11
    - pdiplugin-pycall@1.11
    - py-dask@2026.3 +distributed
    - py-gysmc
    - py-h5py@3.16
    - py-imageio@2.37
    - py-matplotlib@3.11
    - py-netcdf4@1.7
    - py-numexpr@2.14
    - py-numpy@2.4
    - py-psutil@7.2
    - py-pyyaml@6.0
    - py-xarray@2026.4 +io +parallel
  concretizer:
    reuse: false
    unify: true
  packages:
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer:
        - '~performance'
