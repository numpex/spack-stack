spack:
  include:
    - path: site/externals.yaml
      optional: true
    - path: site
      optional: true
    - path: common
      optional: true
  specs:
    - cxx
    - gloo@2025-12-02
    - py-albumentationsx
    - py-gymnasium
    - py-langgraph
    - py-nvidia-dali
    - py-smolagents
    - py-stable-baselines3 +extra
    - py-torch
  concretizer:
    reuse: false
    unify: true
