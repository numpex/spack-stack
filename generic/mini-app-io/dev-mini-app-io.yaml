---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: true
      allow_read:
        - /
      allow_write:
        - /home/runner
  mirrors:
    spack-stack:
      url: oci://ghcr.io/numpex/spack-stack
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    gcc:
      externals:
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
    py-dask:
      prefer:
        - '~dataframe'
    py-pandas:
      prefer: 
        - '~performance'
  repos:
    patches:
      git: https://github.com/gyselax/spack.git
      branch: releases/v2026.06
    builtin:
      branch: releases/v2026.06
  specs:
    - group: compiler
      specs:
        - 'gcc@14.3'
    - group: app
      needs: [compiler]
      specs:
        - 'cmake@4.3'
        - 'gyselalibxx@0.8'
        - 'ninja@1.13'
        - 'pdiplugin-decl-hdf5@1.11 +mpi'
        - 'pdiplugin-decl-netcdf@1.11 +mpi'
        - 'pdiplugin-mpi@1.11'
        - 'pdiplugin-pycall@1.11'
        - 'py-dask@2026.3 +distributed'
        - 'py-gysmc'
        - 'py-h5py@3.16'
        - 'py-imageio@2.37'
        - 'py-matplotlib@3.11 ^freetype@2.14.1'
        - 'py-netcdf4@1.7'
        - 'py-numexpr@2.14'
        - 'py-numpy@2.4'
        - 'py-psutil@7.2'
        - 'py-pyyaml@6.0'
        - 'py-xarray@2026.4 +io +parallel'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
