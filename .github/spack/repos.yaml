# Site configuration for the GitHub Actions runners (ubuntu-24.04), used by CI
# to build the binary cache. Assembled into environments the same way
# install.sh assembles platform configs, through the optional `site/` include.
---
repos:
  patches:
    git: https://github.com/gyselax/spack.git
    branch: releases/v2026.10
    paths:
      - spack_repo/patches_common
    destination: $spack/var/spack/repos/patches-v2026.10
  builtin:
    branch: releases/v2026.10
    destination: $spack/var/spack/repos/builtin-v2026.10
