# Site configuration for the GitHub Actions runners (ubuntu-24.04), used by CI
# to build the binary cache. Assembled into environments the same way
# install.sh assembles platform configs, through the optional `site/` include.
---
packages:
  gcc:
    externals:
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
