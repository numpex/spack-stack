---
name: Build Spack env

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-spack-env:
    strategy:
      fail-fast: false
      matrix:
        env:
          - dev-benchmark-euler-kernels.yaml
          - dev-ddc.yaml
          - dev-gmgpolar.yaml
          - dev-gyselalibxx.yaml
          - dev-gyselaxpp.yaml
          - dev-heraclespp.yaml
          - dev-kokkos.yaml
          - dev-kokkos-fft.yaml
          - dev-mini-app-io.yaml
          - dev-mini-app-poisson.yaml
        os: [ubuntu-24.04]
        target: [x86_64, x86_64_v3, x86_64_v4]
    runs-on: ${{matrix.os}}
    permissions:
      packages: write  # Required to push to registry
    steps:
      - name: Checkout built branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3  # v3.0.0
        with:
          spack_ref: v1.2.2
          buildcache: true
      - name: Prepare environment
        shell: spack-bash {0}
        run: |
          spack bootstrap now
          spack env create . ${{matrix.env}}
          spack --env . config add "packages:all:require:[target=${{matrix.target}}]"
          spack --env . config add config:install_tree:padded_length:128
          spack --env . repo update
          spack --env . buildcache list
      - name: Install
        shell: spack-bash {0}
        run: |
          spack --env . concretize
          spack --env . install --j $(($(nproc) + 1)) --fail-fast --include-build-deps --show-log-on-error
      - name: Push packages and update index
        shell: spack-bash {0}
        env:
          GITHUB_USER: ${{github.actor}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: spack --env . buildcache push --j $(($(nproc) + 1)) --fail-fast --base-image ubuntu:24.04 --update-index spack-stack
        if: ${{!cancelled()}}
