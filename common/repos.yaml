---
# Stack-level Spack configuration, shared by all machines and projects.
# Like the machine-specific platforms/<site>/<arch>/spack/, it is assembled
# into the environment by install.sh (and CI), through the optional `common/`
# include: entries in `repos:` from the other layers are merged on top of the
# ones below.
#
# Only what is truly shared by every machine and project belongs here: the
# builtin package repository, pinned to the branch matching the Spack release
# of this stack (spack-version.txt). Project-specific recipes live in
# projects/<p>/spack/, machine-specific ones in platforms/<site>/<arch>/spack/.
repos:
  builtin:
    branch: releases/v2026.10
    destination: $spack/var/spack/repos/builtin-v2026.10
