---
spack:
  concretizer:
    reuse: false
    unify: true
  config:
    sandbox:
      enable: true
      allow_network: false
      allow_read:
        - /
  mirrors:
    local-buildcache:
      url: oci://ghcr.io/tpadioleau/dev-spack-ubuntu-24.04
      binary: true
      source: false
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  packages:
    all:
      prefer:
        - '~cuda'
        - '~rocm'
        - '~openmp'
        - '~mpi'
        - '~fortran'
    c:
      require: 'gcc@15.2'
    cxx:
      require: 'gcc@15.2'
    fortran:
      require: 'gcc@15.2'
  repos:
    builtin:
      branch: releases/v2026.06
  specs:
    - 'gcc@15.2'
    - 'cmake@4.3'
    - 'googletest@1.17 +gmock'
    - 'kokkos@5.1'
  view:
    default:
      projections:
        all: "{name}-{version}-{hash}"
      root: .spack-env/view
