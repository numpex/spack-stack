---
packages:
  gcc:
    externals:
      - spec: gcc@14.2.1 languages:='c,c++,fortran'
        prefix: /opt/rh/gcc-toolset-14/root/usr
        extra_attributes:
          compilers:
            c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
            fortran: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
          # Coherent toolchain: the toolset binutils (as, ld) knows the
          # AVX512-FP16 instructions that gcc 14 emits, unlike the system
          # assembler. Applied to the build environment of this compiler.
          environment:
            prepend_path:
              PATH: /opt/rh/gcc-toolset-14/root/usr/bin
      - spec: gcc@11.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
